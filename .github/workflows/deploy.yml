name: Build and Deploy
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Team data, Sagarin ratings, the week schedule, and the broadcaster list
      # are fetched daily (refresh-data.yml), not on every push, so a normal code
      # deploy has to carry the last-known copies forward from gh-pages rather
      # than shipping a build missing any of them.
      - name: Fetch existing team data
        run: |
          mkdir -p static/data
          git fetch origin gh-pages && git checkout origin/gh-pages -- data/teams.json && mv data/teams.json static/data/ || true

      - name: Fetch existing conference data
        run: |
          mkdir -p static/data
          git fetch origin gh-pages && git checkout origin/gh-pages -- data/conferences.json && mv data/conferences.json static/data/ || true

      - name: Fetch existing Sagarin data
        run: |
          mkdir -p static/data
          git fetch origin gh-pages && git checkout origin/gh-pages -- data/sagarin.json && mv data/sagarin.json static/data/ || true

      - name: Fetch existing week schedule
        run: |
          mkdir -p static/data
          git fetch origin gh-pages && git checkout origin/gh-pages -- data/weeks.json && mv data/weeks.json static/data/ || true

      - name: Fetch existing broadcaster list
        run: |
          mkdir -p static/data
          git fetch origin gh-pages && git checkout origin/gh-pages -- data/broadcasters.json && mv data/broadcasters.json static/data/ || true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /cfb-games
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          single-commit: true
